# Whole stack: backend on :8000, frontend on :3000, SQLite on a named /data volume.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # SQLite lives on the /data volume so history survives restarts.
      DATABASE_URL: sqlite:////data/app.db
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-groq/openai/gpt-oss-20b}
      LLM_MODELS: ${LLM_MODELS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful assistant.}
      CACHE_TYPE: ${CACHE_TYPE:-local}
      CACHE_DIR: ${CACHE_DIR:-/data/litellm_cache}
      LLM_FAKE_MODE: ${LLM_FAKE_MODE:-false}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-30}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-40}
    volumes:
      - appdata:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser runs on the host, so it reaches the published backend port.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  appdata:
